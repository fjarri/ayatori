[package]
name = "ayatori"
version = "0.2.0-dev"
edition = "2024"
license = "MIT"
authors = ['Bogdan Opanchuk <bogdan@opanchuk.net>']
description = "Graph-based framework for distributed cryptographic protocols"
repository = "https://github.com/fjarri/ayatori"
readme = "README.md"
categories = ["cryptography", "no-std"]
rust-version = "1.91"

[dependencies]
derive-where = { version = "1.5", default-features = false, features = ["serde"] }
itertools = "0.14"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
signature = { version = "2", default-features = false, features = ["digest", "rand_core"] }
serde-encoded-bytes = { version = "0.2", default-features = false, features = ["hex", "generic-array-014"] }
displaydoc = { version = "0.2", default-features = false }
hex = { version = "0.4", default-features = false }

postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"], optional = true }
tokio-util = { version = "0.7", default-features = false, optional = true }
rand = { version = "0.8", default-features = false, optional = true }

[dev-dependencies]
rand_chacha = { version = "0.3", default-features = false }
impls = "1"

# These mirror the versions from the optional dependencies above.
postcard = { version = "1", default-features = false, features = ["alloc"] }

[features]
dev = ["postcard", "serde_json", "rand"]
tokio = ["dep:tokio", "tokio-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
